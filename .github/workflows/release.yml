name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc

      - name: Build native binary & run unit tests
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1 -Clean -RunTests

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $file = "docs/releases/${tag}.md"
          if (Test-Path $file) {
            echo "path=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "KeyStats ${{ github.ref_name }}"
          body_path: ${{ steps.notes.outputs.path }}
          files: build/bin/key-stats.exe
